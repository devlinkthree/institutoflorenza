<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#A95F43" />

  <title>Instituto Florenza | Links oficiais</title>
  <meta
    name="description"
    content="Acesse o site, agende sua avaliação, fale pelo WhatsApp, visite o Instagram e encontre o Instituto Florenza."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="link-page">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero__glow hero__glow--one" aria-hidden="true"></div>
      <div class="hero__glow hero__glow--two" aria-hidden="true"></div>
      <div class="hero__orbit hero__orbit--one" aria-hidden="true"></div>
      <div class="hero__orbit hero__orbit--two" aria-hidden="true"></div>

      <div class="hero__content">
        <img
          class="hero__logo"
          src="logo-florenza-white.png"
          alt="Símbolo do Instituto Florenza"
          onerror="this.style.display='none'"
        />

        <p class="hero__eyebrow">Instituto Florenza</p>

        <h1 id="page-title">
          Saúde feminina com
          <em>acolhimento e tecnologia.</em>
        </h1>

        <p class="hero__subtitle">
          Cuidado integrado para cada fase da sua jornada.
        </p>
      </div>
    </section>

    <section class="actions" aria-label="Links do Instituto Florenza">
      <a
        class="action action--primary"
        href="https://api.whatsapp.com/send/?phone=5511999490837&text=Ol%C3%A1%21+Gostaria+de+agendar+uma+avalia%C3%A7%C3%A3o+no+Instituto+Florenza.&type=phone_number&app_absent=0"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="action__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L4 20l.9-3.7A8.5 8.5 0 1 1 20.5 11.7Z"></path>
            <path d="M8.4 8.1c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.7 1.7c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4 0 .7.4.7 1 1.3 1.7 1.8.3.2.5.2.7 0l.7-.8c.2-.2.4-.3.7-.2l1.8.8c.3.1.4.3.4.6 0 .6-.3 1.5-.9 1.9-.5.4-1.1.6-1.8.5-1.2-.1-2.8-.7-4.4-2.2-1.3-1.3-2.2-2.8-2.4-4-.2-.7 0-1.4.3-2Z"></path>
          </svg>
        </span>

        <span class="action__copy">
          <small>Atendimento</small>
          <strong>Agendar avaliação</strong>
        </span>

        <span class="action__arrow" aria-hidden="true">↗</span>
      </a>

      <div class="action-grid">
        <a
          class="action action--card"
          href="https://institutoflorenza.com.br/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3Z"></path>
            </svg>
          </span>
          <span>
            <small>Conheça</small>
            <strong>Nosso site</strong>
          </span>
          <span class="action__arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="action action--card"
          href="https://instagram.com/institutoflorenza"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.5" cy="6.5" r="1"></circle>
            </svg>
          </span>
          <span>
            <small>Acompanhe</small>
            <strong>Instagram</strong>
          </span>
          <span class="action__arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="action action--card"
          href="https://google.com/maps?ll=-23.581901,-46.672873&z=14&t=m&hl=pt-BR&gl=US&mapclient=embed&q=Rua+do+Rocio+288+Vila+Olimpia+Sao+Paulo"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
          </span>
          <span>
            <small>Vila Olímpia</small>
            <strong>Como chegar</strong>
          </span>
          <span class="action__arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="action action--card"
          href="mailto:atendimento@institutoflorenza.com.br"
        >
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
          </span>
          <span>
            <small>Contato</small>
            <strong>E-mail</strong>
          </span>
          <span class="action__arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>

    <footer class="footer">
      <span>Saúde íntima</span>
      <i aria-hidden="true"></i>
      <span>Hormonal</span>
      <i aria-hidden="true"></i>
      <span>Tricologia</span>
    </footer>
  </main>
</body>
</html>
