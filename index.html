  <script>
    window.addEventListener("load", () => {
      document.body.classList.add("is-loaded");
    });

    const phone = document.querySelector("#phone");
    const background = document.querySelector("#phoneBackground");
    const pointerLight = document.querySelector("#pointerLight");

    const hasFinePointer = window.matchMedia(
      "(pointer: fine)"
    ).matches;

    if (
      phone &&
      background &&
      pointerLight &&
      hasFinePointer
    ) {
      phone.addEventListener("pointermove", (event) => {
        const rect = phone.getBoundingClientRect();

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const normalizedX = x / rect.width - 0.5;
        const normalizedY = y / rect.height - 0.5;

        pointerLight.style.setProperty("--x", `${x}px`);
        pointerLight.style.setProperty("--y", `${y}px`);

        background.style.setProperty(
          "--move-x",
          `${normalizedX * 5}px`
        );

        background.style.setProperty(
          "--move-y",
          `${normalizedY * 5}px`
        );
      });

      phone.addEventListener("pointerleave", () => {
        background.style.setProperty("--move-x", "0px");
        background.style.setProperty("--move-y", "0px");
      });
    }
  </script>
